[project]
name = "flowops"
version = "0.1.0"
description = ""
authors = [
    {name = "luizleite16",email = "luiz.leite@see.pb.gov.br"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "typos",
    "httpx",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=fast_zero', '--cov-context=test']

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.poe]
poetry_command = ""

[tool.poe.tasks]
serve = "fastapi dev fast_zero/app.py"

lint = { cmd = "ruff check" }
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]

test.sequence = [
  "lint",
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]