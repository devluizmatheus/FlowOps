
services:
  # Serviço 1: API FastAPI
  api:
    build: .
    container_name: flowops-api

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://flowops:${POSTGRES_PASSWORD}@db:5432/flowops

    depends_on:
      db:
        condition: service_healthy

  # Serviço 2: PostgreSQL
  db:
    image: postgres:17
    container_name: flowops-db

    environment:
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flowops

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
